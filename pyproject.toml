[project]
name = "symbiknow"
version = "0.1.0"
description = "Local OCFL file memory and ten MCP tools for AI agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp==2.3.0",
  "filelock==4.1.1",
  "python-dotenv==1.2.4",
  "typesafe-sdk==0.7.4",
  "lancedb==0.40.0",
  "pyarrow==26.0.0",
  "docling==2.137.0",
  "sentence-transformers==6.1.0",
  "transformers==5.19.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "Pillow==12.3.0",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "torchao==0.17.0",
]

[project.scripts]
symbiknow = "symbiknow.api.mcp:main"
symbiknow-client = "symbiknow.cli.client:main"

[dependency-groups]
dev = [
    "coverage>=7",
    "lizard==1.17.31",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/symbiknow"]

[tool.hatch.build.targets.sdist]
include = [
  "/backend",
  "/frontend/src",
  "/frontend/tests",
  "/frontend/*.json",
  "/frontend/*.ts",
  "/frontend/index.html",
  "/native/ocfl-reader/src",
  "/native/ocfl-reader/Cargo.toml",
  "/native/ocfl-reader/Cargo.lock",
  "/scripts",
  "/benchmarks",
  "/.github",
  "/.env.example",
  "/.python-version",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
