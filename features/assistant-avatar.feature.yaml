feature: Shared assistant artwork and motion preview
tags:
- '@avatar-preview'
scenarios:
- name: Every pose works for both assistants and both themes
  steps:
  - given: the real assistant artwork preview
  - when: I observe resting avatars at their default app size
  - then: both companions keep calmly moving while at rest
  - and: the conversation has one larger avatar in its header
  - when: I preview every pose for Symbi and Symbi Reflex in both themes
  - then: every pose has loaded artwork and a meaningful accessible name
  - and: changing Symbi Reflex's activity preserves Symbi's activity
  - when: I choose the app sizes and reduce motion
  - then: both portraits use the chosen size and all avatar motion stops
- name: System reduced motion and conversation examples remain usable
  steps:
  - given: the real assistant artwork preview
  - when: the browser requests reduced motion
  - then: both assistants remain visible without animations
  - when: I try the conversation mapping example
  - then: the example shows its map and completion while Symbi Reflex stays at rest
- name: Interrupted or failed activity never celebrates completion
  steps:
  - given: the real assistant artwork preview
  - when: I interrupt each assistant with pause cancellation error and disconnection
  - then: interrupted companions keep calm idle life without showing done
