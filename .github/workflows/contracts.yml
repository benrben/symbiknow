name: Application ownership contracts
on: [push, pull_request]
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/checks/architecture.py
      - run: python scripts/contracts/generate.py --check
